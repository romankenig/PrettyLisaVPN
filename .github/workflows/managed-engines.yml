name: Managed VPN engines

on:
  push:
    paths: ['engines/**', 'vpn-node-agent/**', 'infra/ansible/roles/vpn_node_agent/**', 'apps/android/engine-app/**', '.github/workflows/managed-engines.yml']
  pull_request:
    paths: ['engines/**', 'vpn-node-agent/**', 'infra/ansible/roles/vpn_node_agent/**', 'apps/android/engine-app/**', '.github/workflows/managed-engines.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engines/managed
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: engines/managed/go.sum
      - name: Format, vet, test and build without starting VPN
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          (cd compat/ratelimit && go test -race ./...)
          go build -trimpath -o "$RUNNER_TEMP/pl-engine" ./cmd/pl-engine
          go build -trimpath -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/pl-node-engine" ./cmd/pl-node-engine
          printf '%s\n' '{"action":"version"}' '{"action":"status"}' '{"action":"stop"}' | "$RUNNER_TEMP/pl-engine"
      - name: Enforce dependency licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./cmd/pl-engine --allowed_licenses=MIT,MPL-2.0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC
          go-licenses check ./cmd/pl-node-engine --allowed_licenses=MIT,MPL-2.0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC
      - name: Verify real server process closes accepted sockets
        if: runner.os == 'Linux'
        run: python3 node/process_test.py "$RUNNER_TEMP/pl-node-engine"
      - name: Package Linux engine with corresponding sources and licenses
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/managed-distribution/source"
          cp "$RUNNER_TEMP/pl-node-engine" "$RUNNER_TEMP/managed-distribution/"
          git -C ../.. archive HEAD engines/managed | tar -x -C "$RUNNER_TEMP/managed-distribution/source"
          go mod vendor -o "$RUNNER_TEMP/managed-distribution/source/engines/managed/vendor"
          go-licenses save ./cmd/pl-node-engine --save_path="$RUNNER_TEMP/managed-distribution/licenses"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/managed-distribution/source-sha.txt"
          tar -czf "$RUNNER_TEMP/managed-source.tar.gz" -C "$RUNNER_TEMP/managed-distribution" source licenses source-sha.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: managed-node-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/managed-distribution/pl-node-engine
            ${{ runner.temp }}/managed-source.tar.gz
            ${{ runner.temp }}/managed-distribution/source-sha.txt
          if-no-files-found: error
          retention-days: 14
  node-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vpn-node-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.9'
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest -q
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: vpn-node-agent/dist/*.whl
          if-no-files-found: error
          retention-days: 14
  android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: engines/managed/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build separate native library from current source
        working-directory: engines/managed
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          mkdir -p ../../apps/android/engine-app/libs
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          # Matches XTLS/libXray's Android linker settings for anet and 16 KiB pages.
          gomobile bind -target android/arm64,android/amd64 -androidapi 26 -javapkg com.prettylisavpn.enginecore -trimpath -ldflags='-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384' -o ../../apps/android/engine-app/libs/managed.aar ./mobile
      - name: Enforce Android dependency licenses
        working-directory: engines/managed
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go-licenses check ./mobile --allowed_licenses=MIT,MPL-2.0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC
      - name: Build and lint companion
        working-directory: apps/android
        run: ./gradlew --no-daemon :engine-app:assembleDebug :engine-app:assembleRelease :engine-app:lintDebug :engine-app:lintRelease
      - name: Upload development companion
        uses: actions/upload-artifact@v4
        with:
          name: managed-android-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/engine-app/build/outputs/apk/debug/engine-app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-engine-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/engine-app/build/reports/
          if-no-files-found: warn
          retention-days: 7
