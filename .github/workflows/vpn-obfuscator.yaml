name: VPN obfuscator

on:
  push:
    paths:
      - "vpn-obfuscator/**"
      - ".github/workflows/vpn-obfuscator.yaml"
  pull_request:
    paths:
      - "vpn-obfuscator/**"
      - ".github/workflows/vpn-obfuscator.yaml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --project vpn-obfuscator --all-groups --locked
      - name: Check formatting
        run: vpn-obfuscator/.venv/bin/ruff format --check vpn-obfuscator
      - name: Lint
        run: vpn-obfuscator/.venv/bin/ruff check vpn-obfuscator
      - name: Type-check
        run: vpn-obfuscator/.venv/bin/mypy --config-file vpn-obfuscator/pyproject.toml vpn-obfuscator/src
      - name: Test
        run: vpn-obfuscator/.venv/bin/pytest vpn-obfuscator/tests -q
