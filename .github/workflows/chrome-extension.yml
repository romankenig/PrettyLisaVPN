name: Chrome extension
on:
  workflow_dispatch:
  push:
    paths: ["apps/chrome-extension/**", ".github/workflows/chrome-extension.yml", ".github/workflows/client-download-publish.yml", "infra/deployment/prepare_client_download.py", "infra/deployment/publish_client.py", "infra/deployment/publish_client_container.sh"]
  pull_request:
    paths: ["apps/chrome-extension/**", ".github/workflows/chrome-extension.yml", ".github/workflows/client-download-publish.yml", "infra/deployment/prepare_client_download.py", "infra/deployment/publish_client.py", "infra/deployment/publish_client_container.sh"]
permissions:
  contents: read
concurrency:
  group: chrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  publication-scope:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- apps/chrome-extension infra/deployment/prepare_client_download.py infra/deployment/publish_client.py infra/deployment/publish_client_container.sh .github/workflows/client-download-publish.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            result=$?
            [[ "$result" == 1 ]] || exit "$result"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  check:
    name: MV3 build, lifecycle tests and installed browser UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/chrome-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BACKEND_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.prettylisavpn.com' || 'https://api.test.prettylisavpn.com' }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/review.mjs
      - name: Package installable extension directory
        run: >-
          python ../../infra/deployment/prepare_client_download.py --platform chrome
          --directory dist --output client-download
          --sha "${{ github.sha }}" --run "${{ github.run_id }}"
          --attempt "${{ github.run_attempt }}" --event "${{ github.event_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-download-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/chrome-extension/client-download/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/chrome-extension/dist/
            apps/chrome-extension/review/
          if-no-files-found: error
  publish-client:
    needs: [check, publication-scope]
    if: github.event_name == 'push' && needs.publication-scope.outputs.changed == 'true' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/client-download-publish.yml
    with:
      platform: chrome
      artifact: chrome-download-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit
