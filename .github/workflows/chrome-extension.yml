name: Chrome extension
on:
  workflow_dispatch:
  push:
    paths: ["apps/chrome-extension/**", ".github/workflows/chrome-extension.yml"]
  pull_request:
    paths: ["apps/chrome-extension/**", ".github/workflows/chrome-extension.yml"]
permissions:
  contents: read
concurrency:
  group: chrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: MV3 build, lifecycle tests and installed browser UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/chrome-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/chrome-extension/dist/
            apps/chrome-extension/review/
          if-no-files-found: error
