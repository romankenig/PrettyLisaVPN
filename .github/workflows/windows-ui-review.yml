name: Windows UI review

on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-ui-review.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      billing_evidence_artifact:
        type: string
        required: false
        default: ""
      device_evidence_artifact:
        type: string
        required: false
        default: ""

concurrency:
  group: windows-ui-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Check changed source formatting
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/check-source-format.cjs
      - name: Upload formatting suggestions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-format-suggestions-${{ github.run_id }}
          path: apps/windows/artifacts/formatting/
          if-no-files-found: warn
  review:
    needs: formatting
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/windows
        shell: pwsh
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BILLING_BACKEND_EVIDENCE_PATH: ${{ inputs.billing_evidence_artifact != '' && format('{0}/apps/windows/artifacts/backend-evidence/billing-response.json', github.workspace) || '' }}
      DEVICE_BACKEND_EVIDENCE_PATH: ${{ inputs.device_evidence_artifact != '' && format('{0}/apps/windows/artifacts/backend-evidence/device-response.json', github.workspace) || '' }}
      VITE_APP_ENVIRONMENT: test
      VITE_BACKEND_BASE_URL: http://127.0.0.1:8000
      # Review uses the shipped placeholder executor with fixture account APIs.
      VITE_PUBLIC_LOCATION_URL: http://127.0.0.1:8000/public-location
      VITE_UI_REVIEW_VPN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download recorded backend device responses
        if: inputs.device_evidence_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.device_evidence_artifact }}
          path: apps/windows/artifacts/backend-evidence
      - name: Download recorded backend billing responses
        if: inputs.billing_evidence_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.billing_evidence_artifact }}
          path: apps/windows/artifacts/backend-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          exit $LASTEXITCODE
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check changed source formatting
        run: |
          $formatSources = @("src/support/client.ts", "src/test/supportClient.test.ts", "src/messages/model.ts", "src/messages/client.ts", "src/ui/AccountMessages.tsx", "src/test/messages.test.tsx", "src/ui/About.tsx", "src/ui/SupportDialog.tsx", "src/support/model.ts", "src/test/support.test.tsx", "src/ui/Devices.tsx", "src/test/devices.test.tsx", "src/ui/PaymentChoice.tsx", "src/billing/model.ts", "src/billing/client.ts", "src/billing/preferences.ts", "src/ui/Subscription.tsx", "src/ui/HomeCountryObserver.tsx", "src/native/paymentBrowser.ts", "src/test/billing.test.tsx", "scripts/ci/billing-fixtures.json", "src/review/vpnFixture.ts", "src/ui/TrafficMode.tsx", "src/ui/ConnectionInfo.tsx", "src/vpn/connectionDetails.ts", "src/vpn/protocol.ts", "src/vpn/connection.ts", "src/ui/ConnectionLocationSelector.tsx", "src/ui/CurrentLocation.tsx", "src/ui/CountryIcon.tsx", "src/location/publicLocation.ts", "src/vpn/selection.ts", "src/api/client.ts", "src/auth/session.ts", "src/state/application.tsx", "src/test/connectionLocationSelector.test.tsx", "src/test/currentLocation.test.tsx", "src/test/locationSelection.test.ts", "src/test/publicLocation.test.ts", "src/main.tsx", "src/ui/App.tsx", "src/ui/NavigationIcon.tsx", "src/ui/Settings.tsx", "src/ui/useVersions.ts", "src/test/home.test.tsx", "src/ui/Login.tsx", "src/test/login.test.tsx", "src/test/foundation.test.tsx", "src/test/otpVerification.test.tsx", "src/ui/WindowFrame.tsx", "src/ui/Home.tsx", "src/ui/styles.css", "src/test/windowFrame.test.tsx", "src-tauri/tauri.conf.json", "src-tauri/capabilities/main.json", "scripts/ci/capture-windows-ui.cjs")
          pnpm exec prettier --check --end-of-line auto @formatSources
          if ($LASTEXITCODE -ne 0) {
            pnpm exec prettier --write --end-of-line auto @formatSources
            git diff -- @formatSources
            exit 1
          }
          rustfmt --check --edition 2021 --config skip_children=true src-tauri/src/main.rs src-tauri/src/window_frame.rs src-tauri/src/payment_browser.rs
          exit $LASTEXITCODE
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
          cache-on-failure: true
      - name: Build native UI review executable
        run: |
          cargo metadata --locked --offline --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm tauri build --debug --no-bundle
      - name: Install screenshot tooling separately
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "windows-ui-tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item scripts/ci/capture-windows-ui.cjs $tools
          npm install --prefix $tools --no-audit --no-fund playwright-core@1.56.1
      - name: Capture native Windows WebView2 screens
        run: |
          python scripts/ci/mock-ui-api.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $env:RUNNER_TEMP "windows-ui-tools/capture-windows-ui.cjs")
      - name: Upload screenshots and review executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-review
          overwrite: true
          path: |
            apps/windows/artifacts/ui-review/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload language screenshots from this build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-language-screenshots-${{ github.sha }}-${{ github.run_id }}
          overwrite: true
          path: |
            apps/windows/artifacts/ui-review/12-language-menu*.png
            apps/windows/artifacts/ui-review/13-home-*.png
            apps/windows/artifacts/ui-review/14-home-*.png
            apps/windows/artifacts/ui-review/15-about-*.png
            apps/windows/artifacts/ui-review/16-support-*.png
            apps/windows/artifacts/ui-review/capture-result.json
            apps/windows/artifacts/ui-review/README.txt
          if-no-files-found: warn
          retention-days: 14
