name: VPN server profiles

on:
  push:
    paths:
      - 'server-profiles/**'
      - 'vpn-obfuscator/**'
      - 'infra/ansible/roles/vpn_profiles/**'
      - 'infra/ansible/playbooks/vpn-profiles.yml'
      - '.github/workflows/server-profiles.yaml'
  pull_request:
    paths:
      - 'server-profiles/**'
      - 'vpn-obfuscator/**'
      - 'infra/ansible/roles/vpn_profiles/**'
      - 'infra/ansible/playbooks/vpn-profiles.yml'
      - '.github/workflows/server-profiles.yaml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --project backend --all-groups --locked
      - name: Python validation and evidence tests
        run: |
          backend/.venv/bin/ruff check server-profiles
          backend/.venv/bin/ruff format --check server-profiles
          backend/.venv/bin/pytest server-profiles/tests -q
      - name: Build existing packet wrapper
        run: uv build --wheel --project vpn-obfuscator --out-dir server-profiles/runtime
      - name: Go checks and Linux binaries
        run: |
          docker run --rm -v "$PWD/server-profiles/masque:/src" -w /src golang:1.26 sh -c '
            go test -race ./... && go vet ./... &&
            CGO_ENABLED=0 go test -c -o masque-test . &&
            CGO_ENABLED=0 go build -trimpath -o masque .'
      - name: Build standalone external runner
        run: docker build -t prettylisa-profile-probe:test server-profiles
      - name: Exercise actual Linux TUN descriptor in an isolated namespace
        run: |
          docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
            -e PRETTYLISA_TUN_TEST=1 \
            -v "$PWD/server-profiles/masque/masque-test:/usr/local/bin/masque-test:ro" \
            --entrypoint /usr/local/bin/masque-test prettylisa-profile-probe:test
      - name: Ansible syntax (never deploys from CI)
        run: |
          docker run --rm -e ANSIBLE_ROLES_PATH=/work/infra/ansible/roles \
            -v "$PWD:/work:ro" -w /work/infra/ansible cytopia/ansible:latest-tools \
            ansible-playbook -i localhost, playbooks/vpn-profiles.yml --syntax-check
