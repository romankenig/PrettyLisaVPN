name: Backend

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "infra/docker/**"
      - "infra/deployment/**"
      - ".github/workflows/backend.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/docker/**"
      - "infra/deployment/**"
      - ".github/workflows/backend.yaml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality, tests, migrations, and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_URL: postgresql+asyncpg://prettylisa:ci-only@127.0.0.1:5432/prettylisa
      VALKEY_URL: redis://127.0.0.1:6379/0
      OTP_HMAC_SECRET: ci-only-otp-hmac-secret-at-least-32-characters
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prettylisa
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: prettylisa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prettylisa -d prettylisa"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check . ../infra/deployment/runtime_version.py

      - name: Lint
        run: uv run ruff check . ../infra/deployment/runtime_version.py

      - name: Type check
        run: uv run mypy

      - name: Run unit tests
        run: uv run pytest -m "not integration and not docker"

      - name: Render build identity
        run: |
          python ../infra/deployment/runtime_version.py \
            --sha "${{ github.sha }}" --run "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" --channel preview > runtime-identity.json
          bash -n ../infra/deployment/deploy.sh

      - name: Retain non-secret build identity
        uses: actions/upload-artifact@v4
        with:
          name: backend-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/runtime-identity.json
          if-no-files-found: error

      - name: Validate Alembic migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run integration tests
        run: uv run pytest -m integration
        env:
          RUN_INTEGRATION_TESTS: "1"

      - name: Build backend image
        run: docker build --tag prettylisavpn-backend:test .

      - name: Test backend image and deployment configuration
        run: uv run pytest -m docker
        env:
          RUN_DOCKER_TESTS: "1"

  deploy-development:
    name: Deploy development
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      SSH_DIRECTORY: /tmp/prettylisavpn-${{ github.run_id }}-ssh
      TRANSFER_DIRECTORY: /tmp/prettylisavpn-${{ github.run_id }}-transfer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve runtime identity from package manifest
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 infra/deployment/runtime_version.py \
            --sha "$BUILD_SHA" --run "$BUILD_RUN" --attempt "$BUILD_ATTEMPT" \
            --channel development > runtime-identity.json
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          identity = json.loads(Path("runtime-identity.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for variable, key in (("DEPLOY_IMAGE", "image"),
                                    ("DEPLOY_VERSION", "application_version"),
                                    ("RELEASE_ID", "release_id")):
                  print(f"{variable}={identity[key]}", file=output)
          PYTHON

      - name: Validate development secrets
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          DEV_API_DOMAIN: ${{ secrets.DEV_API_DOMAIN }}
          DEV_ACME_EMAIL: ${{ secrets.DEV_ACME_EMAIL }}
          DEV_POSTGRES_URL: ${{ secrets.DEV_POSTGRES_URL }}
          DEV_VALKEY_URL: ${{ secrets.DEV_VALKEY_URL }}
          DEV_OTP_HMAC_SECRET: ${{ secrets.DEV_OTP_HMAC_SECRET }}
          DEV_EMAIL_SMTP_PASSWORD: ${{ secrets.DEV_EMAIL_SMTP_PASSWORD }}
        run: |
          missing=0
          for secret_name in \
            DEV_VPS_HOST DEV_VPS_PORT DEV_VPS_USER DEV_SSH_PRIVATE_KEY \
            DEV_SSH_KNOWN_HOSTS DEV_API_DOMAIN DEV_ACME_EMAIL \
            DEV_POSTGRES_URL DEV_VALKEY_URL DEV_OTP_HMAC_SECRET \
            DEV_EMAIL_SMTP_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required development secret ${secret_name} is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build development image
        run: docker build --tag "$DEPLOY_IMAGE" backend

      - name: Prepare encrypted connection and transfer files
        env:
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          DEV_API_DOMAIN: ${{ secrets.DEV_API_DOMAIN }}
          DEV_ACME_EMAIL: ${{ secrets.DEV_ACME_EMAIL }}
          DEV_POSTGRES_URL: ${{ secrets.DEV_POSTGRES_URL }}
          DEV_VALKEY_URL: ${{ secrets.DEV_VALKEY_URL }}
          DEV_OTP_HMAC_SECRET: ${{ secrets.DEV_OTP_HMAC_SECRET }}
          DEV_EMAIL_SMTP_PASSWORD: ${{ secrets.DEV_EMAIL_SMTP_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$SSH_DIRECTORY" "$TRANSFER_DIRECTORY"
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" > "$SSH_DIRECTORY/id_ed25519"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > "$SSH_DIRECTORY/known_hosts"
          chmod 600 "$SSH_DIRECTORY/id_ed25519" "$SSH_DIRECTORY/known_hosts"
          ssh-keygen -y -f "$SSH_DIRECTORY/id_ed25519" >/dev/null

          for value_name in DEV_API_DOMAIN DEV_ACME_EMAIL DEV_POSTGRES_URL DEV_VALKEY_URL DEV_OTP_HMAC_SECRET DEV_EMAIL_SMTP_PASSWORD
          do
            value="${!value_name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* || "$value" == *"'"* ]]; then
              echo "::error::${value_name} must be a single-line env-file value without quotes"
              exit 1
            fi
          done

          {
            printf "COMPOSE_PROJECT_NAME='prettylisavpn-development'\n"
            printf "API_DOMAIN='%s'\n" "$DEV_API_DOMAIN"
            printf "ACME_EMAIL='%s'\n" "$DEV_ACME_EMAIL"
            printf "BACKEND_IMAGE='%s'\n" "$DEPLOY_IMAGE"
            printf "APPLICATION_NAME='PrettyLisaVPN'\n"
            printf "APPLICATION_VERSION='%s'\n" "$DEPLOY_VERSION"
            printf "ENVIRONMENT='development'\n"
            printf "LOG_LEVEL='INFO'\n"
            printf "POSTGRES_URL='%s'\n" "$DEV_POSTGRES_URL"
            printf "VALKEY_URL='%s'\n" "$DEV_VALKEY_URL"
            printf "OTP_HMAC_SECRET='%s'\n" "$DEV_OTP_HMAC_SECRET"
            printf "ACCESS_TOKEN_TTL_SECONDS='900'\n"
            printf "REFRESH_TOKEN_TTL_SECONDS='2592000'\n"
            printf "EMAIL_PROVIDER='timeweb'\n"
            printf "EMAIL_SMTP_HOST='smtp.timeweb.ru'\n"
            printf "EMAIL_SMTP_PORT='465'\n"
            printf "EMAIL_SMTP_TLS_MODE='implicit_tls'\n"
            printf "EMAIL_SMTP_USERNAME='auth@prettylisavpn.com'\n"
            printf "EMAIL_SMTP_PASSWORD='%s'\n" "$DEV_EMAIL_SMTP_PASSWORD"
            printf "EMAIL_FROM_ADDRESS='auth@prettylisavpn.com'\n"
            printf "EMAIL_FROM_NAME='PrettyLisaVPN'\n"
            printf "EMAIL_CONNECTION_TIMEOUT_SECONDS='5'\n"
            printf "EMAIL_SEND_TIMEOUT_SECONDS='10'\n"
            printf "DEPENDENCY_TIMEOUT_SECONDS='5'\n"
            printf "POSTGRES_POOL_SIZE='5'\n"
            printf "POSTGRES_MAX_OVERFLOW='5'\n"
            printf "HTTP_BIND_ADDRESS='0.0.0.0'\n"
            printf "HTTP_PORT='80'\n"
            printf "HTTPS_BIND_ADDRESS='0.0.0.0'\n"
            printf "HTTPS_PORT='443'\n"
          } > "$TRANSFER_DIRECTORY/development.env"

          tar -czf "$TRANSFER_DIRECTORY/deployment.tar.gz" \
            -C infra/deployment Caddyfile compose.yaml compose.node-agent.yaml deploy.sh
          cp runtime-identity.json "$TRANSFER_DIRECTORY/runtime-identity.json"
          docker save "$DEPLOY_IMAGE" | gzip -1 > "$TRANSFER_DIRECTORY/backend-image.tar.gz"

      - name: Transfer and deploy development
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
        run: |
          remote="${DEV_VPS_USER}@${DEV_VPS_HOST}"
          incoming="/opt/prettylisavpn/incoming/${RELEASE_ID}"
          common_options=(
            -i "$SSH_DIRECTORY/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIRECTORY/known_hosts"
            -o LogLevel=ERROR
          )

          ssh "${common_options[@]}" -p "$DEV_VPS_PORT" \
            "$remote" "install -d -m 0700 '$incoming'"
          scp "${common_options[@]}" -P "$DEV_VPS_PORT" \
            "$TRANSFER_DIRECTORY/development.env" \
            "$TRANSFER_DIRECTORY/runtime-identity.json" \
            "$TRANSFER_DIRECTORY/deployment.tar.gz" \
            "$TRANSFER_DIRECTORY/backend-image.tar.gz" \
            "${remote}:${incoming}/"

          ssh "${common_options[@]}" -p "$DEV_VPS_PORT" "$remote" \
            "bash -s -- '$RELEASE_ID' '$DEPLOY_IMAGE' '$DEPLOY_VERSION'" <<'REMOTE'
          set -Eeuo pipefail

          revision="$1"
          expected_image="$2"
          expected_version="$3"
          deployment_root="/opt/prettylisavpn"
          incoming_directory="${deployment_root}/incoming/${revision}"
          release_directory="${deployment_root}/releases/${revision}"
          environment_file="${deployment_root}/secrets/deployment.env"

          node_agent_environment="${deployment_root}/secrets/node-agent.env"
          if [[ -f "$node_agent_environment" ]]; then
            grep -E '^VPN_NODE_(AGENT_AUTH_TOKEN|AGENT_TLS_DIRECTORY|AGENT_PORT|STALE_TIMEOUT_SECONDS|HEALTH_POLL_INTERVAL_SECONDS)=' \
              "$node_agent_environment" >> "${incoming_directory}/development.env" || true
          fi

          cleanup() {
            rm -f \
              "${incoming_directory}/development.env" \
              "${incoming_directory}/runtime-identity.json" \
              "${incoming_directory}/deployment.tar.gz" \
              "${incoming_directory}/backend-image.tar.gz"
            rmdir "$incoming_directory" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Never overwrite a release, including a rerun of the same source SHA.
          if [[ -e "$release_directory" ]]; then
            printf 'Release directory already exists. Use a new run attempt.\n' >&2
            exit 1
          fi
          install -d -m 0700 "$release_directory"
          tar -xzf "${incoming_directory}/deployment.tar.gz" -C "$release_directory"
          chmod 0755 "${release_directory}/deploy.sh"

          loaded_image="$(gzip -dc "${incoming_directory}/backend-image.tar.gz" | docker load)"
          if [[ "$loaded_image" != *"${expected_image}"* ]]; then
            printf 'Loaded image did not match the expected revision.\n' >&2
            exit 1
          fi

          # Archive the exact former env before replacing the running application.
          if [[ -f "$environment_file" ]]; then
            install -m 0600 "$environment_file" "${release_directory}/previous.env"
          fi
          install -m 0600 "${incoming_directory}/development.env" "${release_directory}/deployment.env"
          install -m 0600 "${incoming_directory}/runtime-identity.json" "${release_directory}/runtime-identity.json"
          docker image inspect --format '{{.Id}}' "$expected_image" > "${release_directory}/image-id"

          SKIP_BACKEND_PULL=1 \
            "${release_directory}/deploy.sh" "${incoming_directory}/development.env"

          install -d -m 0700 "${deployment_root}/secrets"
          install -m 0600 "${incoming_directory}/development.env" "$environment_file"
          ln -sfn "$release_directory" "${deployment_root}/current.next"
          mv -Tf "${deployment_root}/current.next" "${deployment_root}/current"
          printf 'Development revision %s deployed as %s.\n' "$revision" "$expected_version"
          REMOTE

