name: Backend
on:
  push:
    paths: ["backend/**", "infra/docker/**", ".github/workflows/backend.yaml"]
  pull_request:
    paths: ["backend/**", "infra/docker/**", ".github/workflows/backend.yaml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prettylisa
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: prettylisa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prettylisa -d prettylisa"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv==0.12.9
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          RUN_INTEGRATION_TESTS: "1"
      - run: docker build -t prettylisavpn-backend:test .
      - run: uv run pytest -m docker
        env:
          RUN_DOCKER_TESTS: "1"
