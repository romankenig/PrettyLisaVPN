name: Support preparation
on:
  push:
    branches: [cloud/prepare-support]
    paths: [.github/workflows/prepare-support.yaml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.9'
      - name: Check support credential binding
        env:
          SUPPORT_SECRET: ${{ secrets.DEV_SUPPORT_SMTP_PASSWORD }}
        run: |
          if [[ -z "$SUPPORT_SECRET" ]]; then echo '::error::DEV_SUPPORT_SMTP_PASSWORD is missing'; exit 1; fi
          echo 'Separate support credential is configured.'
      - name: Prepare current source snapshot
        run: |
          python - <<'PYTHON'
          import json, base64
          from pathlib import Path
          for path, content in json.loads(base64.b64decode('')).items():
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)
          PYTHON
      - name: Resolve lock and install
        working-directory: backend
        run: uv lock && uv sync --frozen
      - name: Format and validate
        working-directory: backend
        run: |
          uv run ruff format . ../infra/deployment/runtime_version.py
          uv run ruff check --fix . ../infra/deployment/runtime_version.py
          uv run mypy
          uv run pytest -m 'not integration and not docker'
      - name: Return reviewed source and lock
        if: always()
        run: |
          python - <<'PYTHON'
          import base64, json, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          changed += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', 'backend'], text=True).splitlines()
          for path in sorted(set(changed)):
              if path.startswith('backend/') and Path(path).is_file():
                  print('SUPPORT_PREP_FILE ' + json.dumps({'path':path, 'content':base64.b64encode(Path(path).read_bytes()).decode()}))
          PYTHON
