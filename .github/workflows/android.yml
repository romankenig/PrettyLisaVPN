name: Android debug

on:
  push:
    paths:
      - 'apps/android/**'
      - 'engines/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'engines/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: engines/managed/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build isolated native engine for the single APK from current source
        working-directory: engines/managed
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          mkdir -p ../../apps/android/engine-app/libs
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          # Matches XTLS/libXray's Android linker settings for anet and 16 KiB pages.
          gomobile bind -target android/arm64,android/amd64 -androidapi 26 -javapkg com.prettylisavpn.enginecore -trimpath -ldflags='-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384' -o ../../apps/android/engine-app/libs/managed.aar ./mobile
      - name: Enforce Android dependency licenses
        working-directory: engines/managed
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go-licenses check ./mobile --allowed_licenses=MIT,MPL-2.0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC
      - name: Package corresponding engine sources and licenses
        working-directory: engines/managed
        run: |
          mkdir -p "$RUNNER_TEMP/android-engine-source/source"
          git -C ../.. archive HEAD engines/managed apps/android | tar -x -C "$RUNNER_TEMP/android-engine-source/source"
          go mod vendor -o "$RUNNER_TEMP/android-engine-source/source/engines/managed/vendor"
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go-licenses save ./mobile --save_path="$RUNNER_TEMP/android-engine-source/licenses"
          cp -R "$RUNNER_TEMP/android-engine-source/licenses" ../../apps/android/app/src/main/assets/engine-licenses
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/android-engine-source/source-sha.txt"
          tar -czf "$RUNNER_TEMP/android-engine-source.tar.gz" -C "$RUNNER_TEMP/android-engine-source" .
      - uses: actions/upload-artifact@v4
        with:
          name: android-engine-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-engine-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Check language catalogs
        run: python3 scripts/check-localization.py
      - name: Inspect published WireGuard versions
        run: python3 -c "import urllib.request; print(urllib.request.urlopen('https://repo.maven.apache.org/maven2/com/wireguard/android/tunnel/maven-metadata.xml', timeout=20).read().decode())"
      - name: Build current checkout and instrumented tests; lint
        run: ./gradlew --no-daemon -PsourceSha="$GITHUB_SHA" :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:lintRelease
      - name: Verify debug adapter is absent from release
        run: |
          python3 scripts/check-source-isolation.py
          python3 scripts/check-vpn-packaging.py
      - name: Record build identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/record-build.py
      - name: Upload debug APK from this commit
        uses: actions/upload-artifact@v4
        with:
          name: PrettyLisaVPN-android-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/build-identity.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/app/build/reports/
          retention-days: 7

  emulator:
    name: Emulator API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PrettyLisaVPN-android-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install isolated VPN test peer tools
        run: sudo apt-get update -qq && sudo apt-get install -y wireguard-tools
      - name: Launch, design, keyboard and font-scale acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 4096 -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash apps/android/scripts/emulator-smoke.sh
      - name: Upload native screenshots and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-api${{ matrix.api }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
