name: Android debug

on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      live_wireguard:
        description: One real WireGuard attempt using an expiring disposable account
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-wireguard:
    name: Real WireGuard on isolated Android
    if: github.event_name == 'workflow_dispatch' && inputs.live_wireguard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PrettyLisaVPN-android-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-apk
      - name: Prepare private, expiring acceptance credential
        env:
          ACCEPTANCE_CREDENTIAL: ${{ secrets.WIREGUARD_ACCEPTANCE_CREDENTIAL }}
        run: |
          umask 077
          test -n "$ACCEPTANCE_CREDENTIAL"
          printf '%s' "$ACCEPTANCE_CREDENTIAL" > "$RUNNER_TEMP/pl-wg-credentials.json"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One real client attempt
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 4096 -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash apps/android/scripts/live-wireguard.sh
      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/pl-wg-credentials.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-live-wireguard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wireguard-evidence/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Debug APK and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check language catalogs
        run: python3 scripts/check-localization.py
      - name: Build current checkout and instrumented tests; lint
        run: ./gradlew --no-daemon -PsourceSha="$GITHUB_SHA" :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:lintRelease
      - name: Verify debug adapter is absent from release
        run: |
          python3 scripts/check-source-isolation.py
          python3 scripts/check-vpn-packaging.py
      - name: Record build identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/record-build.py
      - name: Upload debug APK from this commit
        uses: actions/upload-artifact@v4
        with:
          name: PrettyLisaVPN-android-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/build-identity.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/app/build/reports/
          retention-days: 7

  emulator:
    name: Emulator API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PrettyLisaVPN-android-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch, design, keyboard and font-scale acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 4096 -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash apps/android/scripts/emulator-smoke.sh
      - name: Upload native screenshots and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-api${{ matrix.api }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
