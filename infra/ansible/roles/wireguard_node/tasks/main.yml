---
- name: Validate WireGuard scalar settings
  ansible.builtin.assert:
    that:
      - wireguard_interface is match('^[A-Za-z0-9_.-]{1,15}$')
      - wireguard_listen_port | int >= 1
      - wireguard_listen_port | int <= 65535
    fail_msg: WireGuard interface or listen port is invalid.

- name: Validate WireGuard IPv4 network and gateway
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import ipaddress;
        network=ipaddress.ip_network('{{ wireguard_client_subnet }}', strict=True);
        gateway=ipaddress.ip_interface('{{ wireguard_gateway_cidr }}');
        assert network.version == gateway.version == 4;
        assert gateway.network == network;
        assert gateway.ip in network and gateway.ip not in (network.network_address, network.broadcast_address)
  changed_when: false

- name: Select public egress interface
  ansible.builtin.set_fact:
    wireguard_egress_interface: >-
      {{ wireguard_public_interface
         if wireguard_public_interface
         else ansible_default_ipv4.interface }}

- name: Validate public egress interface
  ansible.builtin.assert:
    that:
      - wireguard_egress_interface is match('^[A-Za-z0-9_.-]{1,15}$')
      - wireguard_egress_interface != wireguard_interface
    fail_msg: A valid non-WireGuard public egress interface is required.

- name: Install official Ubuntu WireGuard and firewall packages
  ansible.builtin.apt:
    name:
      - wireguard
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create restricted WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate server private key only on the node
  ansible.builtin.shell: |
    umask 077
    wg genkey > {{ wireguard_private_key_path | quote }}
  args:
    creates: "{{ wireguard_private_key_path }}"
    executable: /bin/sh
  no_log: true
  notify: restart wireguard

- name: Derive server public key only on the node
  ansible.builtin.shell: |
    umask 077
    wg pubkey < {{ wireguard_private_key_path | quote }} > {{ wireguard_public_key_path | quote }}
  args:
    creates: "{{ wireguard_public_key_path }}"
    executable: /bin/sh
  no_log: true

- name: Enforce restrictive server key permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ wireguard_private_key_path }}"
    - "{{ wireguard_public_key_path }}"
  no_log: true

- name: Install WireGuard interface configuration without client peers
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/{{ wireguard_interface }}.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart wireguard

- name: Enable IPv4 forwarding persistently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-prettylisavpn-wireguard.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible for PrettyLisaVPN VPN data-plane routing.
      net.ipv4.ip_forward = 1
  notify: apply wireguard sysctl

- name: Read current UFW state
  ansible.builtin.command: ufw status
  register: wireguard_ufw_status
  changed_when: false
  when: wireguard_manage_ufw

- name: Require baseline UFW before changing network access
  ansible.builtin.assert:
    that: "'Status: active' in wireguard_ufw_status.stdout"
    fail_msg: >-
      UFW must already be active with verified SSH access. Apply the secure node baseline first.
  when:
    - wireguard_manage_ufw
    - wireguard_require_active_ufw

- name: Disable UFW packet logging
  ansible.builtin.command: ufw logging off
  changed_when: false
  when: wireguard_manage_ufw

- name: Allow WireGuard UDP ingress in UFW
  ansible.builtin.command: >-
    ufw allow {{ wireguard_listen_port }}/udp comment 'PrettyLisaVPN WireGuard'
  register: wireguard_ufw_ingress
  changed_when: "'Rule added' in wireguard_ufw_ingress.stdout"
  when: wireguard_manage_ufw

- name: Allow client forwarding from WireGuard to public interface in UFW
  ansible.builtin.command: >-
    ufw route allow in on {{ wireguard_interface }} out on {{ wireguard_egress_interface }}
    from {{ wireguard_client_subnet }} comment 'PrettyLisaVPN client forwarding'
  register: wireguard_ufw_route
  changed_when: "'Rule added' in wireguard_ufw_route.stdout"
  when: wireguard_manage_ufw

- name: Configure UFW NAT masquerading for WireGuard clients
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    insertbefore: '^\*filter'
    marker: "# {mark} ANSIBLE MANAGED PRETTYLISAVPN WIREGUARD NAT"
    block: |
      *nat
      :POSTROUTING ACCEPT [0:0]
      -A POSTROUTING -s {{ wireguard_client_subnet }} -o {{ wireguard_egress_interface }} -j MASQUERADE
      COMMIT
  notify: reload wireguard firewall
  when: wireguard_manage_ufw

- name: Apply forwarding and firewall changes before interface startup
  ansible.builtin.meta: flush_handlers

- name: Enable and start WireGuard at boot
  ansible.builtin.systemd_service:
    name: wg-quick@{{ wireguard_interface }}
    enabled: true
    state: started
