---
- name: Validate VPN obfuscator settings
  ansible.builtin.assert:
    that:
      - vpn_obfuscator_wheel_local_path is string
      - vpn_obfuscator_wheel_local_path | length > 0
      - vpn_obfuscator_bind_ipv4 is match('^(0\.0\.0\.0|[0-9]{1,3}(\.[0-9]{1,3}){3})$')
      - vpn_obfuscator_wireguard_ipv4 == '127.0.0.1'
      - vpn_obfuscator_public_port | int >= 1
      - vpn_obfuscator_public_port | int <= 65535
      - vpn_obfuscator_wireguard_port | int >= 1
      - vpn_obfuscator_wireguard_port | int <= 65535
      - vpn_obfuscator_public_port | int != vpn_obfuscator_wireguard_port | int
      - not wireguard_expose_public_udp | bool
    fail_msg: >-
      Supply a built obfuscator wheel, distinct public/internal UDP ports, loopback WireGuard
      transport, and wireguard_expose_public_udp=false.

- name: Install VPN obfuscator Python runtime support
  ansible.builtin.apt:
    name:
      - openssl
      - python3
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create restricted VPN obfuscator group
  ansible.builtin.group:
    name: "{{ vpn_obfuscator_group }}"
    system: true

- name: Create restricted VPN obfuscator user
  ansible.builtin.user:
    name: "{{ vpn_obfuscator_user }}"
    group: "{{ vpn_obfuscator_group }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Create VPN obfuscator directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vpn_obfuscator_install_root }}"
      group: root
      mode: "0755"
    - path: "{{ vpn_obfuscator_install_root }}/releases"
      group: root
      mode: "0755"
    - path: "{{ vpn_obfuscator_config_root }}"
      group: "{{ vpn_obfuscator_group }}"
      mode: "0750"

- name: Generate the obfuscation secret only on the VPN node
  ansible.builtin.shell: |
    set -eu
    umask 077
    printf 'PRETTYLISA_OBFUSCATION_SECRET=' > {{ vpn_obfuscator_secret_environment_path | quote }}
    openssl rand -base64 32 | tr -d '\n' >> {{ vpn_obfuscator_secret_environment_path | quote }}
    printf '\n' >> {{ vpn_obfuscator_secret_environment_path | quote }}
  args:
    creates: "{{ vpn_obfuscator_secret_environment_path }}"
    executable: /bin/sh
  no_log: true
  notify: restart vpn obfuscator
  when: not ansible_check_mode

- name: Restrict the VPN obfuscation secret
  ansible.builtin.file:
    path: "{{ vpn_obfuscator_secret_environment_path }}"
    owner: root
    group: "{{ vpn_obfuscator_group }}"
    mode: "0640"
  no_log: true
  notify: restart vpn obfuscator
  when: not ansible_check_mode

- name: Copy versioned VPN obfuscator wheel
  ansible.builtin.copy:
    src: "{{ vpn_obfuscator_wheel_local_path }}"
    dest: >-
      {{ vpn_obfuscator_install_root }}/releases/{{ vpn_obfuscator_wheel_local_path | basename }}
    owner: root
    group: root
    mode: "0644"

- name: Create isolated VPN obfuscator virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ vpn_obfuscator_install_root }}/venv"
  args:
    creates: "{{ vpn_obfuscator_install_root }}/venv/bin/python"

- name: Install VPN obfuscator release into its virtual environment
  ansible.builtin.pip:
    name: >-
      {{ vpn_obfuscator_install_root }}/releases/{{ vpn_obfuscator_wheel_local_path | basename }}
    virtualenv: "{{ vpn_obfuscator_install_root }}/venv"
    state: present
  notify: restart vpn obfuscator

- name: Install non-secret VPN obfuscator environment
  ansible.builtin.template:
    src: obfuscator.env.j2
    dest: "{{ vpn_obfuscator_config_root }}/obfuscator.env"
    owner: root
    group: "{{ vpn_obfuscator_group }}"
    mode: "0640"
  notify: restart vpn obfuscator

- name: Install restricted VPN obfuscator systemd unit
  ansible.builtin.template:
    src: prettylisavpn-obfuscator.service.j2
    dest: /etc/systemd/system/prettylisavpn-obfuscator.service
    owner: root
    group: root
    mode: "0644"
  notify: restart vpn obfuscator

- name: Apply VPN obfuscator service changes before firewall cutover
  ansible.builtin.meta: flush_handlers

- name: Enable and start VPN obfuscator
  ansible.builtin.systemd_service:
    name: prettylisavpn-obfuscator
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Allow public PrettyLisaVPN obfuscation ingress
  ansible.builtin.command: >-
    ufw allow in on {{ wireguard_egress_interface }} proto udp from 0.0.0.0/0
    to {{ wireguard_ingress_ipv4 }} port {{ vpn_obfuscator_public_port }}
    comment 'PrettyLisaVPN obfuscated UDP IPv4'
  register: vpn_obfuscator_ufw_ingress
  changed_when: "'Rule added' in vpn_obfuscator_ufw_ingress.stdout"

- name: Remove public raw WireGuard ingress
  ansible.builtin.command: >-
    ufw delete allow in on {{ wireguard_egress_interface }} proto udp from 0.0.0.0/0
    to {{ wireguard_ingress_ipv4 }} port {{ vpn_obfuscator_wireguard_port }}
    comment 'PrettyLisaVPN WireGuard IPv4'
  register: vpn_obfuscator_raw_wireguard_ufw_delete
  changed_when: "'Rule deleted' in vpn_obfuscator_raw_wireguard_ufw_delete.stdout"
  failed_when:
    - vpn_obfuscator_raw_wireguard_ufw_delete.rc != 0
    - >-
      'Could not delete non-existent rule' not in
      (vpn_obfuscator_raw_wireguard_ufw_delete.stdout ~
       vpn_obfuscator_raw_wireguard_ufw_delete.stderr)
    - >-
      'Could not find a matching rule' not in
      (vpn_obfuscator_raw_wireguard_ufw_delete.stdout ~
       vpn_obfuscator_raw_wireguard_ufw_delete.stderr)

- name: Verify VPN obfuscator public listener
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -lun
      - "sport = :{{ vpn_obfuscator_public_port }}"
  register: vpn_obfuscator_public_listener
  changed_when: false
  check_mode: false
  failed_when: vpn_obfuscator_public_port | string not in vpn_obfuscator_public_listener.stdout
  when: not ansible_check_mode

- name: Verify local WireGuard listener
  ansible.builtin.command:
    argv:
      - wg
      - show
      - "{{ wireguard_interface }}"
      - listen-port
  register: vpn_obfuscator_wireguard_listener
  changed_when: false
  check_mode: false
  failed_when: vpn_obfuscator_wireguard_listener.stdout | trim != vpn_obfuscator_wireguard_port | string
  when: not ansible_check_mode
