---
vpn_obfuscator_user: prettylisa-obfuscator
vpn_obfuscator_group: prettylisa-obfuscator
vpn_obfuscator_install_root: /opt/prettylisavpn-obfuscator
vpn_obfuscator_config_root: /etc/prettylisavpn-obfuscator
vpn_obfuscator_wheel_local_path: null
vpn_obfuscator_bind_ipv4: "{{ wireguard_ingress_ipv4 }}"
vpn_obfuscator_public_port: 443
vpn_obfuscator_wireguard_ipv4: 127.0.0.1
vpn_obfuscator_wireguard_port: "{{ wireguard_listen_port }}"
vpn_obfuscator_max_packet_size: 4096
vpn_obfuscator_max_padding_size: 255
vpn_obfuscator_max_clients: 1024
vpn_obfuscator_client_idle_timeout_seconds: 180
vpn_obfuscator_status_interval_seconds: 60
vpn_obfuscator_secret_environment_path: "{{ vpn_obfuscator_config_root }}/secret.env"
