---
vpn_node_agent_user: prettylisa-agent
vpn_node_agent_group: prettylisa-agent
vpn_node_agent_install_root: /opt/prettylisavpn-agent
vpn_node_agent_config_root: /etc/prettylisavpn-agent
vpn_node_agent_wheel_local_path: null
vpn_node_agent_auth_token: null
vpn_node_agent_backend_ipv4_cidr: null
vpn_node_agent_bind_ipv4: "{{ wireguard_ingress_ipv4 }}"
vpn_node_agent_port: 8443
vpn_node_agent_tls_certificate: /etc/prettylisavpn-agent/tls/server.crt
vpn_node_agent_tls_private_key: /etc/prettylisavpn-agent/tls/server.key
vpn_node_agent_tls_client_ca: /etc/prettylisavpn-agent/tls/client-ca.crt
