---
- name: Require node agent deployment inputs
  ansible.builtin.assert:
    that:
      - vpn_node_agent_wheel_local_path is string
      - vpn_node_agent_wheel_local_path | length > 0
      - vpn_node_agent_auth_token is string
      - vpn_node_agent_auth_token | length >= 32
      - vpn_node_agent_backend_ipv4_cidr is string
      - vpn_node_agent_backend_ipv4_cidr is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/32$')
      - vpn_node_agent_bind_ipv4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - vpn_node_agent_port | int >= 1
      - vpn_node_agent_port | int <= 65535
      - vpn_node_agent_port | int != ansible_port | default(22) | int
      - vpn_node_agent_port | int != 22
    fail_msg: >-
      Supply a wheel path, a 32+ character vaulted token, and the backend public IPv4 /32.
  no_log: true

- name: Install node agent Python runtime support
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create restricted node agent group
  ansible.builtin.group:
    name: "{{ vpn_node_agent_group }}"
    system: true

- name: Create restricted node agent user
  ansible.builtin.user:
    name: "{{ vpn_node_agent_user }}"
    group: "{{ vpn_node_agent_group }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Create node agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vpn_node_agent_install_root }}"
      group: root
      mode: "0755"
    - path: "{{ vpn_node_agent_install_root }}/releases"
      group: root
      mode: "0755"
    - path: "{{ vpn_node_agent_config_root }}"
      group: "{{ vpn_node_agent_group }}"
      mode: "0750"
    - path: "{{ vpn_node_agent_config_root }}/tls"
      group: "{{ vpn_node_agent_group }}"
      mode: "0750"

- name: Inspect required pre-provisioned mTLS files
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  no_log: true
  register: vpn_node_agent_tls_files
  loop:
    - "{{ vpn_node_agent_tls_certificate }}"
    - "{{ vpn_node_agent_tls_private_key }}"
    - "{{ vpn_node_agent_tls_client_ca }}"

- name: Require all mTLS files before exposing the agent
  no_log: true
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Required mTLS file is missing: {{ item.item }}"
  loop: "{{ vpn_node_agent_tls_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Restrict mTLS material to root and the agent
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ vpn_node_agent_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vpn_node_agent_tls_certificate }}"
      mode: "0640"
    - path: "{{ vpn_node_agent_tls_private_key }}"
      mode: "0640"
    - path: "{{ vpn_node_agent_tls_client_ca }}"
      mode: "0640"
  no_log: true
  notify: restart vpn node agent

- name: Copy versioned node agent wheel
  ansible.builtin.copy:
    src: "{{ vpn_node_agent_wheel_local_path }}"
    dest: "{{ vpn_node_agent_install_root }}/releases/{{ vpn_node_agent_wheel_local_path | basename }}"
    owner: root
    group: root
    mode: "0644"
  register: vpn_node_agent_wheel_copy

- name: Create isolated node agent virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ vpn_node_agent_install_root }}/venv"
  args:
    creates: "{{ vpn_node_agent_install_root }}/venv/bin/python"

- name: Install node agent release into its virtual environment
  ansible.builtin.pip:
    name: >-
      {{ vpn_node_agent_install_root }}/releases/{{ vpn_node_agent_wheel_local_path | basename }}
    virtualenv: "{{ vpn_node_agent_install_root }}/venv"
    state: present
  notify: restart vpn node agent

- name: Provision optional managed transport
  ansible.builtin.include_tasks: managed.yml
  when: vpn_node_agent_managed_enabled

- name: Install protected node agent environment
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ vpn_node_agent_config_root }}/agent.env"
    owner: root
    group: "{{ vpn_node_agent_group }}"
    mode: "0640"
  no_log: true
  notify: restart vpn node agent

- name: Install restricted systemd unit
  ansible.builtin.template:
    src: prettylisavpn-node-agent.service.j2
    dest: /etc/systemd/system/prettylisavpn-node-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: restart vpn node agent

- name: Preview agent firewall commands and SSH safety boundary
  ansible.builtin.debug:
    msg: >-
      {{ lookup('template', 'agent-firewall.sh.j2') }}
      Only the configured agent port is affected. No SSH rules or global policies change.
      An incorrect backend source IP blocks API control but leaves SSH available.

- name: Install backend-only agent firewall script
  ansible.builtin.template:
    src: agent-firewall.sh.j2
    dest: "{{ vpn_node_agent_config_root }}/agent-firewall.sh"
    owner: root
    group: root
    mode: '0700'

- name: Install persistent agent firewall service
  ansible.builtin.template:
    src: agent-firewall.service.j2
    dest: /etc/systemd/system/prettylisavpn-agent-firewall.service
    owner: root
    group: root
    mode: '0644'

- name: Restrict access before starting the agent even when UFW is inactive
  ansible.builtin.systemd_service:
    name: prettylisavpn-agent-firewall
    enabled: true
    state: restarted
    daemon_reload: true

- name: Allow node agent only from backend public IPv4
  ansible.builtin.command: >-
    ufw allow in on {{ wireguard_egress_interface }} proto tcp
    from {{ vpn_node_agent_backend_ipv4_cidr }} to {{ vpn_node_agent_bind_ipv4 }}
    port {{ vpn_node_agent_port }} comment 'PrettyLisaVPN backend to node agent mTLS'
  register: vpn_node_agent_ufw
  changed_when: "'Rule added' in vpn_node_agent_ufw.stdout"

- name: Apply agent service changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start restricted node agent
  ansible.builtin.systemd_service:
    name: prettylisavpn-node-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Verify node agent service is listening on the configured address
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -lnt
      - "sport = :{{ vpn_node_agent_port }}"
  register: vpn_node_agent_listener
  changed_when: false
  check_mode: false
  failed_when: vpn_node_agent_bind_ipv4 not in vpn_node_agent_listener.stdout
  when: not ansible_check_mode
