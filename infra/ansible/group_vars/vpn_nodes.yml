---
wireguard_client_subnet: 10.77.0.0/16
wireguard_gateway_cidr: 10.77.0.1/16
wireguard_listen_port: 51820

# Leave null to use the interface carrying the host's default IPv4 route.
wireguard_public_interface: null
# Leave null to use the IPv4 source address selected by that default route.
wireguard_public_ipv4: null

# The baseline must already have active UFW and working key-only SSH access.
wireguard_manage_ufw: true
wireguard_require_active_ufw: true

# Stage 3AB transport: public UDP/443 forwards authenticated envelopes to local UDP/51820.
vpn_obfuscator_public_port: 443
vpn_obfuscator_wireguard_port: "{{ wireguard_listen_port }}"
