name: prettylisavpn

services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release tag or digest}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${FLEET_ENV_FILE:-/etc/prettylisavpn/fleet.env}
        required: false
    environment: &backend_environment
      APPLICATION_NAME: ${APPLICATION_NAME:-PrettyLisaVPN}
      APPLICATION_VERSION: ${APPLICATION_VERSION:?Set APPLICATION_VERSION}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL for managed PostgreSQL}
      VALKEY_URL: ${VALKEY_URL:?Set VALKEY_URL for managed Valkey}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET to at least 32 random characters}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_REQUEST_COOLDOWN_SECONDS: ${OTP_REQUEST_COOLDOWN_SECONDS:-60}
      OTP_EMAIL_REQUEST_LIMIT: ${OTP_EMAIL_REQUEST_LIMIT:-5}
      OTP_EMAIL_RATE_WINDOW_SECONDS: ${OTP_EMAIL_RATE_WINDOW_SECONDS:-3600}
      OTP_IP_REQUEST_LIMIT: ${OTP_IP_REQUEST_LIMIT:-20}
      OTP_IP_RATE_WINDOW_SECONDS: ${OTP_IP_RATE_WINDOW_SECONDS:-3600}
      OTP_MAX_VERIFICATION_ATTEMPTS: ${OTP_MAX_VERIFICATION_ATTEMPTS:-5}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SUPPORT_SMTP_PASSWORD: ${SUPPORT_SMTP_PASSWORD:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-timeweb}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.timeweb.ru}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_TLS_MODE: ${EMAIL_SMTP_TLS_MODE:-implicit_tls}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-auth@prettylisavpn.com}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-auth@prettylisavpn.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-PrettyLisaVPN}
      EMAIL_CONNECTION_TIMEOUT_SECONDS: ${EMAIL_CONNECTION_TIMEOUT_SECONDS:-5}
      EMAIL_SEND_TIMEOUT_SECONDS: ${EMAIL_SEND_TIMEOUT_SECONDS:-10}
      FORWARDED_ALLOW_IPS: "*"
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
    expose:
      - "8000"
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fleet-worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    profiles: [fleet]
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    command: [python, -m, prettylisavpn.fleet.worker]
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ${FLEET_ENV_FILE:-/etc/prettylisavpn/fleet.env}
        required: false
    environment:
      <<: *backend_environment
      FLEET_INVENTORY_PATH: /run/fleet/inventory.json
      HOME: /tmp
    volumes:
      - ${FLEET_CREDENTIALS_DIR:-/etc/prettylisavpn/fleet}:/run/fleet:ro
    networks: [application]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notices}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DASHBOARD_DIR:-/etc/prettylisavpn/dashboard}:/etc/caddy/dashboard:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - application
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  application:

volumes:
  caddy_data:
  caddy_config:

