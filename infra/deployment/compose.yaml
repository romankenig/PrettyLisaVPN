name: prettylisavpn

services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release tag or digest}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APPLICATION_NAME: ${APPLICATION_NAME:-PrettyLisaVPN}
      APPLICATION_VERSION: ${APPLICATION_VERSION:?Set APPLICATION_VERSION}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL for managed PostgreSQL}
      VALKEY_URL: ${VALKEY_URL:?Set VALKEY_URL for managed Valkey}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
    expose:
      - "8000"
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notices}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - application
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  application:

volumes:
  caddy_data:
  caddy_config:
