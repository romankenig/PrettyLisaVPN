# Standalone deployment file: do not merge with the development Compose file.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a built release image tag or digest}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ENVIRONMENT: production
      APPLICATION_NAME: ${APPLICATION_NAME:-PrettyLisaVPN}
      APPLICATION_VERSION: ${APPLICATION_VERSION:?Set APPLICATION_VERSION to the release version}
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL to the external PostgreSQL connection URL}
      VALKEY_URL: ${VALKEY_URL:?Set VALKEY_URL to the external Valkey connection URL}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET to at least 32 random characters}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_REQUEST_COOLDOWN_SECONDS: ${OTP_REQUEST_COOLDOWN_SECONDS:-60}
      OTP_EMAIL_REQUEST_LIMIT: ${OTP_EMAIL_REQUEST_LIMIT:-5}
      OTP_EMAIL_RATE_WINDOW_SECONDS: ${OTP_EMAIL_RATE_WINDOW_SECONDS:-3600}
      OTP_IP_REQUEST_LIMIT: ${OTP_IP_REQUEST_LIMIT:-20}
      OTP_IP_RATE_WINDOW_SECONDS: ${OTP_IP_RATE_WINDOW_SECONDS:-3600}
      OTP_MAX_VERIFICATION_ATTEMPTS: ${OTP_MAX_VERIFICATION_ATTEMPTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
