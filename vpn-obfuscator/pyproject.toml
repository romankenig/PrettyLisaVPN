[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prettylisavpn-obfuscator"
version = "0.1.0"
description = "Minimal first-party UDP obfuscation transport for PrettyLisaVPN nodes"
requires-python = ">=3.12,<3.14"
dependencies = ["cryptography>=42,<46"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prettylisavpn_obfuscator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
