[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prettylisavpn-backend"
version = "0.5.0"
description = "PrettyLisaVPN control-plane backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "redis>=5.2,<7",
    "uvicorn>=0.34,<1",
    "aiosmtplib>=5.1.2,<6",
    "email-validator>=2.2,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.22,<1",
    "pillow>=12.3,<13",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prettylisavpn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real PostgreSQL and Valkey (RUN_INTEGRATION_TESTS=1)",
    "docker: requires Docker and a built image (RUN_DOCKER_TESTS=1)",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

