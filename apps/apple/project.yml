name: PrettyLisaVPN
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  developmentLanguage: en
  knownRegions: [en, ru, de, es, fr, zh-Hans]
packages:
  PrettyLisaCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targetTemplates:
  Application:
    type: application
    sources:
      - App
      - Platform
      - path: Resources
        excludes: [Fixtures]
      - path: Resources/Fixtures
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - package: PrettyLisaCore
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
    settings:
      base:
        PRODUCT_NAME: PrettyLisaVPN
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PrettyLisaVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_APIBaseURL: $(API_BASE_URL)
        INFOPLIST_KEY_SharedKeychainGroup: $(KEYCHAIN_GROUP)
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
    info:
      path: Config/App-Info-${target_name}.plist
      properties:
        CFBundleDisplayName: PrettyLisaVPN
        APIBaseURL: $(API_BASE_URL)
        SharedKeychainGroup: $(KEYCHAIN_GROUP)
        UILaunchScreen: {}
        NSHumanReadableCopyright: PrettyLisaVPN
        ITSAppUsesNonExemptEncryption: true
  Tunnel:
    type: app-extension
    sources:
      - Extension
      - path: Platform/Keychain.swift
    dependencies:
      - package: PrettyLisaCore
      - framework: Vendor/PrettyLisaEngine.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    settings:
      base:
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/Tunnel.entitlements
        OTHER_LDFLAGS: ['$(inherited)', '-lresolv']
    info:
      path: Config/Tunnel-Info-${target_name}.plist
      properties:
        CFBundleDisplayName: PrettyLisaVPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
targets:
  PrettyLisaVPN-iOS:
    templates: [Application]
    platform: iOS
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        CODE_SIGN_ENTITLEMENTS: Config/App-iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: PacketTunnel-iOS
        embed: true
  PacketTunnel-iOS:
    templates: [Tunnel]
    platform: iOS
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.tunnel
        CODE_SIGN_ENTITLEMENTS: Config/Tunnel-iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
  PrettyLisaVPN-macOS:
    templates: [Application]
    platform: macOS
    configFiles:
      Debug: Config/macOS.xcconfig
      Release: Config/macOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).macos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    dependencies:
      - target: PacketTunnel-macOS
        embed: true
  PacketTunnel-macOS:
    templates: [Tunnel]
    platform: macOS
    configFiles:
      Debug: Config/macOS.xcconfig
      Release: Config/macOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).macos.tunnel
  AppleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UI
    dependencies:
      - target: PrettyLisaVPN-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.uitests
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
  MacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/MacUI
    dependencies:
      - target: PrettyLisaVPN-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).macos.uitests
    configFiles:
      Debug: Config/macOS.xcconfig
      Release: Config/macOS.xcconfig
schemes:
  PrettyLisaVPN-iOS:
    build:
      targets:
        PrettyLisaVPN-iOS: all
    test:
      targets: [AppleUITests]
  PrettyLisaVPN-macOS:
    build:
      targets:
        PrettyLisaVPN-macOS: all
    test:
      targets: [MacUITests]
